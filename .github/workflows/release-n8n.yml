name: Release n8n community node

on:
  push:
    tags:
      - 'n8n-v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/n8n
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm run test
      - run: npm run release
        env:
          # Publishes over OIDC via the trusted publisher on
          # n8n-nodes-tnl-intelligence; see release-npm.yml.
          NPM_CONFIG_PROVENANCE: 'true'
