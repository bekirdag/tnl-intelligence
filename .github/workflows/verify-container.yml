name: Verify published container

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published container version tag
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and smoke test
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/bekirdag/tnl-intelligence:${{ inputs.version }}"
          container="tnl-published-${{ github.run_id }}"

          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker pull "$image"
          manifest="$(docker buildx imagetools inspect --raw "$image")"
          jq -e '.manifests | any(.platform.os == "linux" and .platform.architecture == "amd64")' \
            <<<"$manifest" >/dev/null
          jq -e '.manifests | any(.platform.os == "linux" and .platform.architecture == "arm64")' \
            <<<"$manifest" >/dev/null
          jq -e '.annotations["org.opencontainers.image.description"] | length > 0' \
            <<<"$manifest" >/dev/null
          jq -e '.annotations["org.opencontainers.image.created"] | length > 0' \
            <<<"$manifest" >/dev/null
          jq -e '.annotations["io.artifacthub.package.readme-url"] | length > 0' \
            <<<"$manifest" >/dev/null
          image_config="$(docker image inspect "$image")"
          digest="$(jq -r '.[0].RepoDigests[0] // empty' <<<"$image_config")"
          test -n "$digest"
          test "$(jq -r '.[0].Config.User' <<<"$image_config")" = "node"
          test -n "$(jq -r \
            '.[0].Config.Labels["org.opencontainers.image.description"] // empty' \
            <<<"$image_config")"
          test -n "$(jq -r \
            '.[0].Config.Labels["io.artifacthub.package.readme-url"] // empty' \
            <<<"$image_config")"

          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            anchore/grype@sha256:391bfda62888fb4e98ff5c4c81598f7431a3c1eac3f8519d69d1ff00df247c1d \
            "docker:$image" \
            --fail-on high \
            --output table

          docker run -d \
            --name "$container" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            -p 127.0.0.1::7317 \
            -e TNL_API_KEY=tnl_registry_smoke_key \
            "$image" >/dev/null

          port_output="$(docker port "$container" 7317/tcp)"
          port="${port_output##*:}"
          healthy=0
          for _ in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:$port/healthz" >/dev/null; then
              healthy=1
              break
            fi
            sleep 0.25
          done
          test "$healthy" -eq 1

          status="$(curl -sS -o /tmp/tnl-mcp-response -w '%{http_code}' \
            -X POST "http://127.0.0.1:$port/mcp")"
          test "$status" = "401"

          printf 'Verified %s\n' "$digest"
          # Markdown backticks in the step summary are literals.
          # shellcheck disable=SC2016
          printf '### Published container verification\n\n- `%s`\n- platforms: `linux/amd64`, `linux/arm64`\n- Artifact Hub metadata: pass\n- vulnerability gate: no high or critical findings\n- `/healthz`: pass\n- unauthenticated `/mcp`: `401`\n' \
            "$digest" >>"$GITHUB_STEP_SUMMARY"
