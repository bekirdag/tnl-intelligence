name: Publish Artifact Hub repository metadata

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oras-project/setup-oras@v2
      - name: Log in to GHCR
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" |
            oras login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Publish repository metadata
        run: |
          oras push ghcr.io/bekirdag/tnl-intelligence:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
      - name: Verify published metadata
        run: |
          mkdir -p "$RUNNER_TEMP/artifacthub-metadata"
          oras pull ghcr.io/bekirdag/tnl-intelligence:artifacthub.io \
            --output "$RUNNER_TEMP/artifacthub-metadata"
          cmp artifacthub-repo.yml "$RUNNER_TEMP/artifacthub-metadata/artifacthub-repo.yml"
