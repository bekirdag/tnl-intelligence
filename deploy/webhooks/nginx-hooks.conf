# Dedicated virtual host for the TNL production webhook control API.
#
# The main TNL site is the nginx default_server, so without an explicit
# server_name for this hostname every webhook request lands on the website and
# returns website 404s. This vhost claims the hostname and proxies only the
# webhook control paths to the loopback service.
#
# Install:
#   sudo cp deploy/webhooks/nginx-hooks.conf /etc/nginx/sites-available/tnl-hooks.conf
#   sudo ln -s /etc/nginx/sites-available/tnl-hooks.conf /etc/nginx/sites-enabled/
#   sudo certbot certonly --nginx -d hooks.theneuralledger.com
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name hooks.theneuralledger.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://hooks.theneuralledger.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hooks.theneuralledger.com;

    ssl_certificate     /etc/letsencrypt/live/hooks.theneuralledger.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hooks.theneuralledger.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/hooks.theneuralledger.com.access.log;
    error_log  /var/log/nginx/hooks.theneuralledger.com.error.log;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Subscription payloads are small; anything larger is rejected at the edge.
    client_max_body_size 64k;

    # Operational metrics stay private to the host.
    location = /metrics {
        return 404;
    }

    location ~ ^/(healthz|readyz)$ {
        proxy_pass http://127.0.0.1:7322;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location /v1/webhooks/ {
        proxy_pass http://127.0.0.1:7322;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        return 404 '{"error":{"code":"not_found","message":"not found"}}';
        add_header Content-Type application/json always;
    }
}
